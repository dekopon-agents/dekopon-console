[workspace]
members = ["crates/dekopon-console", "crates/dekopon-tui"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dekopon-agents/dekopon-console"
homepage = "https://github.com/dekopon-agents/dekopon-console"
authors = ["Dekopon contributors"]

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.31"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

# Phase A prepublish migration only: all nine crates use one immutable core revision.
# Before landing/releasing, replace these git dependencies with exact crates.io =0.31.0
# pins and restore the published-dependency CI gate (C7-20).
dekopon-agent = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
dekopon-broker-protocol = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
dekopon-config = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
dekopon-core = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf", default-features = false }
dekopon-model = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
# ModelUsage moved out of dekopon-model in 0.31; this crate is already in core's lock.
dekopon-model-token-governor = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
dekopon-protocol = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf", default-features = false }
dekopon-process = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
dekopon-shell = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
dekopon-telemetry = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf", features = ["exporter"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace", "logs"] }
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
prost = "0.14.3"
dekopon-tui = { version = "0.11.1", path = "crates/dekopon-tui" }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# Discarding a failure's cause at the site that discards it is the defect class dekopon's own
# review found most often. A site that legitimately drops one takes a scoped `#[allow]` with a
# reason.
map_err_ignore = "deny"
let_underscore_must_use = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 4
