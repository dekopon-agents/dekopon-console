name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CONSOLE_RUST_TOOLCHAIN: "1.98.1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `--component clippy rustfmt` reads the second name as a toolchain, not a component, so
      # both names need their own flag. `rustup override set` is what makes the pin real: without
      # it the toolchain is installed and then every cargo step below runs on the runner default.
      - run: |
          rustup toolchain install "$CONSOLE_RUST_TOOLCHAIN" --profile minimal \
            --component clippy --component rustfmt
          rustup override set "$CONSOLE_RUST_TOOLCHAIN"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      # This console is a client of published dekopon crates, and the pin is the contract. A path
      # or git dependency would make a green build here say nothing about what `cargo install
      # dekopon-console` produces, which is exactly how the `gh` provider's branch pin rotted.
      - name: Reject path and git dependencies on dekopon crates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              deps = tomllib.load(manifest)["workspace"]["dependencies"]
          core = (
              "dekopon-agent", "dekopon-broker-protocol", "dekopon-config",
              "dekopon-core", "dekopon-model", "dekopon-model-token-governor",
              "dekopon-process", "dekopon-protocol", "dekopon-shell", "dekopon-telemetry",
          )
          number = r"(?:0|[1-9][0-9]*)"
          prerelease = rf"(?:{number}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          exact = rf"={number}\.{number}\.{number}(?:-{prerelease}(?:\.{prerelease})*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          for name in core:
              dep = deps.get(name)
              if dep is None or (isinstance(dep, dict) and dep.get("package", name) != name):
                  raise SystemExit(f"{name} must name its required package")
          for name, dep in deps.items():
              package = dep.get("package", name) if isinstance(dep, dict) else name
              if not (name.startswith("dekopon-") or package.startswith("dekopon-")):
                  continue
              if name == package == "dekopon-tui":
                  if not isinstance(dep, dict) or dep.get("path") != "crates/dekopon-tui" or dep.get("version") != "0.11.1" or any(key in dep for key in ("git", "registry", "registry-index")):
                      raise SystemExit("only the versioned local dekopon-tui path is allowed")
                  continue
              version = dep if isinstance(dep, str) else dep.get("version") if isinstance(dep, dict) else None
              if not isinstance(version, str) or re.fullmatch(exact, version) is None:
                  raise SystemExit(f"{name} must have an exact = version")
              if isinstance(dep, dict) and any(key in dep for key in ("git", "path", "registry", "registry-index")):
                  raise SystemExit(f"{name} must use crates.io, not git/path/alternate registry")
          PY
