[package]
name = "dekopon-tui"
description = "Terminal console for driving Dekopon agents against a running local broker"
# Deliberately the version it last had inside the dekopon monorepo, and it stays there until this
# repository publishes a release of its own. The crates.io name is the same one, so the published
# lineage continues here rather than restarting; a version that went backwards would break that.
version = "0.11.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopon-tui"
readme = "README.md"
keywords = ["agents", "tui", "console", "capabilities", "security"]
categories = ["command-line-utilities"]
include = ["src/**", "README.md", "Cargo.toml"]

[dependencies]
crossterm.workspace = true
dekopon-agent.workspace = true
dekopon-broker-protocol.workspace = true
dekopon-core.workspace = true
dekopon-model.workspace = true
dekopon-protocol.workspace = true
dekopon-process.workspace = true
dekopon-shell.workspace = true
futures-util.workspace = true
ratatui.workspace = true
rustix.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
dekopon-config.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
dekopon-telemetry.workspace = true
opentelemetry-proto.workspace = true
prost.workspace = true
tempfile.workspace = true

[lints]
workspace = true
